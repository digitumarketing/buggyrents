name = "buggyrents"
compatibility_date = "2026-08-01"

# Static-assets-only Worker. The whole public site is prerendered HTML,
# so there is no Worker script — Cloudflare serves dist/ straight from the edge.
[assets]
directory = "./dist"

# Switch to "404-page" once the 404 template is built and dist/404.html exists.
not_found_handling = "none"
