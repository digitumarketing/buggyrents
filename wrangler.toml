name = "buggyrents"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Astro builds the Worker now, because Keystatic and the contact endpoint both need
# server routes. The 65 public pages are still prerendered HTML served from assets;
# only /keystatic, /api/keystatic and /api/contact run on the Worker.
main = "./dist/_worker.js/index.js"

# The Cloudflare adapter turns on Astro sessions and expects a KV namespace called
# SESSION. Without this binding anything touching a session fails at runtime with
# "Invalid binding `SESSION`", and Keystatic's login would be the first casualty.
# Created 10 Aug 2026 with: npx wrangler kv namespace create SESSION
[[kv_namespaces]]
binding = "SESSION"
id = "26fbb3981e554353ad600fbb2b2f4850"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Without this, a request that matches no file in dist is answered by the asset
# router using not_found_handling above, and the Worker is never invoked. Every
# page of this site is a real file so that is the behaviour we want almost
# everywhere: a genuine typo gets the branded 404 page rather than a blank one.
#
# The three paths below have no file behind them by design. They are the CMS, its
# OAuth callbacks and the contact form endpoint, and they only exist inside the
# Worker. Listing them here sends those requests to the Worker before the asset
# router can turn them into a 404. Bare /keystatic is listed separately because
# /keystatic/* does not match it.
run_worker_first = ["/keystatic", "/keystatic/*", "/api/*"]

# Contact form delivery. Plain vars, not secrets.
# Verify buggyrents.com at resend.com, then change CONTACT_FROM to
# "Buggy Rents Website <bookings@buggyrents.com>" so mail stops landing in spam.
[vars]
CONTACT_FROM  = "Buggy Rents Website <onboarding@resend.dev>"
CONTACT_INBOX = "Buggyrents@gmail.com"
