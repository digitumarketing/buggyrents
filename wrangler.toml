name = "buggyrents"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Required by @astrojs/cloudflare for session storage.
# Create the namespace once:  npx wrangler kv namespace create SESSION
# then paste the id below.
[[kv_namespaces]]
binding = "SESSION"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
